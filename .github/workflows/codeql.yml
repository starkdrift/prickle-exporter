# SPDX-License-Identifier: Apache-2.0
#
# CodeQL. Free for public repositories, and low-noise on a standard-library-only
# Go codebase — there is no dependency graph for it to get lost in, so what it
# reports is about this code.
#
# The interesting surface is small but real: hand-written text exposition, a
# net/http handler, and parsers fed by files the exporter does not control.
name: codeql

# See ci.yml for why this is pull_request and not pull_request_target. The
# weekly schedule keeps this from becoming a merge-time-only check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query still finds old code.
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # Strictly the maintainer and Dependabot. Anything else — a fork PR, or a
    # collaborator added later — is skipped rather than run, because
    # ci/check.sh lives in this repository and an untrusted PR would run its
    # own edited copy of it.
    #
    # OWNER rather than a literal username: GitHub usernames can be changed,
    # and a stale name here would silently skip the maintainer's own PRs.
    # pull_request.user.login is the PR author; github.actor is whoever pushed
    # last, which on a synchronize event is not the same person.
    #
    # This is a condition in the file, not a reliance on Settings -> Actions ->
    # "Require approval for outside collaborators". That setting is the right
    # second layer but cannot be read back with a read-only token, so it cannot
    # be verified from here. Note the two do different jobs: this stops the code
    # running, and only branch protection requiring this check stops an
    # unverified PR being merged — a skipped job reports no failure.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.user.login == 'dependabot[bot]'))

    name: analyze
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: go
          build-mode: autobuild
          queries: security-and-quality

      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:go"
