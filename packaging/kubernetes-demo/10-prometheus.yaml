# SPDX-License-Identifier: Apache-2.0
#
# Prometheus, scraping prickle by pod discovery rather than through the Service.
# The Service is headless and every pod reports about a different node, so
# scraping the Service name would hit one node at random and hide the rest.
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: prickle-demo}
---
# The RBAC here belongs to Prometheus, not to prickle. prickle needs no API
# access at all — it reads the node's filesystem — and its own chart creates no
# ServiceAccount. This is Prometheus needing to *find* the pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: prickle-demo-prometheus}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: prickle-demo-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prickle-demo-prometheus}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: prickle-demo}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: prickle-demo}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prickle
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only prickle's own pods, in whichever namespace it was installed.
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: prickle-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          # The exporter already sets `node` on every series from the downward
          # API. Keeping the pod name as `instance` makes a target identifiable
          # without overwriting anything prickle produced.
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: prickle-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=6h
          ports: [{containerPort: 9090, name: http}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        # Demo storage. Six hours of retention on an emptyDir: this is for
        # looking at, not for keeping.
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: prickle-demo}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: http, name: http}]
