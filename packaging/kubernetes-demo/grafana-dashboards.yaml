            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS}"
              },
              "expr": "count(prickle_collector_success{node=~\".*$node_search.*\"} == 0) or vector(0)",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Collectors failing",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "description": "Non-zero means a cardinality cap fired and a collector's tail was discarded. The default cap is far above any real host, so this should be flat zero.",
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
