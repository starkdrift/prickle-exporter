                "uid": "${DS}"
              },
              "expr": "count(count by (node) (prickle_collector_series{node=~\".*$node_search.*\"}))",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Nodes reporting",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS}"
          },
          "description": "A collector can fail and still emit: partial data plus a raised error total beats an empty family.",
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 5,
            "y": 1
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
