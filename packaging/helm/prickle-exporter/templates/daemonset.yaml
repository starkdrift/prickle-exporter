{{/* SPDX-License-Identifier: Apache-2.0 */}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "prickle.fullname" . }}
  labels: {{- include "prickle.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "prickle.selectorLabels" . | nindent 6 }}
  updateStrategy: {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "prickle.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # No ServiceAccount and no RBAC anywhere in this chart. prickle reads the
      # node's filesystem, never the Kubernetes API — pod identity comes from
      # cgroup directory names. Nothing here needs a token, so nothing here
      # gets one.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # hostNetwork so :10047 is the node's own port, which is what a node-level
      # scrape config expects to find.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.collectors.perProcess }}
      # Only for per-process GPU attribution: the exe symlink of another
      # process is not visible without the host PID namespace.
      hostPID: true
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: prickle
          image: {{ include "prickle.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -path.rootfs=/host
            - -web.listen-address=:{{ .Values.service.port }}
            - -sample.interval={{ .Values.sampleInterval }}
            - -collector.timeout={{ .Values.collectorTimeout }}
            - -collector.max-series={{ .Values.collectors.maxSeries }}
            - -log.level={{ .Values.logLevel }}
            - -collector.container={{ .Values.collectors.container }}
            - -collector.gpu={{ .Values.collectors.gpu }}
            {{- if .Values.collectors.perProcess }}
            - -collector.gpu.per-process=true
            {{- end }}
            {{- if .Values.collectors.podNames.enabled }}
            - -collector.container.pod-names=true
            {{- end }}
            {{- with .Values.collectors.dockerSocket }}
            - -collector.container.docker-socket={{ . }}
            {{- end }}
            # The node's own name, not the pod's. A pod's view of the hostname
            # is not the node's, so `node` would otherwise be a pod name.
            - -node=$(NODE_NAME)
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
              hostPort: {{ .Values.service.port }}
          securityContext:
            # Everything the exporter reads is world-readable, so it needs no
            # privilege and is given none. SPEC.md §Hard constraints #2: it is
            # strictly read-only, and this is where the kernel enforces that
            # rather than the code promising it.
            runAsNonRoot: {{ not .Values.collectors.perProcess }}
            runAsUser: {{ if .Values.collectors.perProcess }}0{{ else }}65532{{ end }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
              {{- if .Values.collectors.podNames.enabled }}
              # The one grant that buys pod names. Bypasses file-read checks
              # host-wide; see values.yaml before enabling.
              add: ["DAC_READ_SEARCH"]
              {{- end }}
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            # /metrics answers 503 until the first sampling pass completes: an
            # empty 200 would read as "this node has no metrics", which is a lie.
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: sys, mountPath: /host/sys, readOnly: true}
            {{- if .Values.collectors.podNames.enabled }}
            - {name: pod-logs, mountPath: /host/var/log/pods, readOnly: true}
            {{- end }}
            {{- with .Values.collectors.dockerSocket }}
            - {name: docker-socket, mountPath: {{ . }}, readOnly: true}
            {{- end }}
            {{- if .Values.nvml.enabled }}
            # One file, not the directory it lives in. LD_LIBRARY_PATH in the
            # image points at /nvidia. Verified on an H100 with driver 580:
            # this plus the device nodes is enough for `live source: nvml`.
            - {name: nvidia-ml, mountPath: /nvidia/libnvidia-ml.so.1, readOnly: true}
            {{- range .Values.nvml.devices }}
            - {name: dev-{{ base . }}, mountPath: {{ . }} }
            {{- end }}
            {{- end }}
      volumes:
        - {name: proc, hostPath: {path: /proc}}
        - {name: sys, hostPath: {path: /sys}}
        {{- if .Values.collectors.podNames.enabled }}
        - {name: pod-logs, hostPath: {path: {{ .Values.collectors.podNames.hostPath }}}}
        {{- end }}
        {{- with .Values.collectors.dockerSocket }}
        - {name: docker-socket, hostPath: {path: {{ . }}, type: Socket}}
        {{- end }}
        {{- if .Values.nvml.enabled }}
        - {name: nvidia-ml, hostPath: {path: {{ .Values.nvml.libraryPath }}, type: File}}
        {{- range .Values.nvml.devices }}
        - {name: dev-{{ base . }}, hostPath: {path: {{ . }}, type: CharDevice}}
        {{- end }}
        {{- end }}
