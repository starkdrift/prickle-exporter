# SPDX-License-Identifier: Apache-2.0

image:
  repository: ghcr.io/starkdrift/prickle-exporter
  # Empty means the chart's appVersion, so the chart and the binary move together.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# SPEC.md §Distribution ships two artifacts. The default `prickle` is static and
# takes the nvidia-smi path; `prickle-nvml` is dynamically linked and dlopens
# NVML, which is the preferred path on an NVIDIA host but cannot be a static
# binary. Setting this to true selects the -nvml image tag and grants the driver
# devices the NVML path needs.
nvml:
  enabled: false
  tagSuffix: "-nvml"
  # The host path of the driver's NVML library. It must match the running
  # driver, so it is mounted from the host rather than baked into the image —
  # and mounted as a SINGLE FILE, not as its directory. The directory holds 855
  # files on a Debian host including libc.so.6, and mounting it would replace
  # the container's own libc with the host's to solve a one-file problem.
  # RHEL-family hosts put it under /usr/lib64.
  libraryPath: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
  # Device nodes NVML opens, mounted for runtimes that honour a hostPath device.
  #
  # On Kubernetes these are NOT sufficient on their own, and the chart no longer
  # relies on them: a hostPath makes the device node *visible* but does not add
  # it to the container's device cgroup, so an unprivileged container is still
  # denied and nvmlInit returns 999. Bisected on an H100 — root, drop ALL and
  # seccomp all made no difference; only privileged: true worked, which is the
  # tell that the device cgroup is what is refusing.
  #
  # `visibleDevices` below is what actually grants access. These stay for
  # runtimes without the NVIDIA container runtime, where they do work.
  devices:
    - /dev/nvidiactl
    - /dev/nvidia0

  # How the NVIDIA container runtime is asked for the GPU. This is the
  # mechanism that both injects the devices and allows them in the device
  # cgroup, and unlike `resources.limits.nvidia.com/gpu: 1` it does NOT consume
  # an allocatable GPU — the exporter must not take a card away from the work it
  # exists to measure, which on a single-GPU node would mean taking the only one.
  # Verified unprivileged, runAsNonRoot 65532, drop ALL, seccomp RuntimeDefault.
  visibleDevices: "all"
  driverCapabilities: "utility"

collectors:
  container: true
  gpu: true
  # One series per distinct command per GPU, keyed on the exe basename and
  # never a PID. Needs hostPID to see other processes' /proc entries, which is
  # why it is off by default: it widens the pod's view of the node.
  perProcess: false
  # Resolve a pod's UID to its namespace and name by listing the kubelet's
  # /var/log/pods, which is mounted read-only when this is on.
  #
  # That path is 0750 root:root, and what reads it is **group root**: the pod
  # runs as uid 65532 with `runAsGroup: 0`, so the directory's group bits let it
  # in. Enabling this therefore costs group-root membership and nothing more.
  #
  # It used to add CAP_DAC_READ_SEARCH, which was measured on 2026-08-04 to do
  # nothing at all: Kubernetes puts a capability added to a **non-root** uid in
  # the bounding set only, so CapPrm, CapEff and CapAmb are all zero and it is
  # unusable. The feature worked anyway because `runAsGroup` was unset and the
  # process inherited gid 0 — an accident that a routine hardening pass would
  # have silently reverted. The capability is gone and the group is now explicit.
  # (Under systemd the same capability *does* work, because AmbientCapabilities=
  # sets the ambient set. Kubernetes exposes no equivalent.)
  #
  # Without this, every container is still reported, identified by pod UID.
  # Note 0750-with-group-root is what these hosts ship; a node whose
  # /var/log/pods is 0700 needs the exporter to run as uid 0 instead.
  podNames:
    enabled: false
    hostPath: /var/log/pods

  # Optional enrichment for human-readable container names and images. Mounting
  # the Docker socket into a pod is a real grant; off unless asked for.
  dockerSocket: ""
  # Per-collector series cap. 0 disables. The default is far above any real
  # host — it is a backstop against runaway cardinality, not a budget.
  maxSeries: 100000

sampleInterval: 10s
collectorTimeout: 5s
logLevel: info

service:
  port: 10047
  annotations: {}

serviceMonitor:
  # Requires the Prometheus operator's CRD. Left off so a plain cluster can
  # install the chart without the CRD being present.
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []
  metricRelabelings: []

# A node exporter is useless on the nodes it cannot run on, so by default it
# tolerates everything — control-plane taints and GPU taints alike.
tolerations:
  - operator: Exists
nodeSelector: {}
affinity: {}
priorityClassName: system-node-critical

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

podAnnotations: {}
podLabels: {}
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
